<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lista_proyectos' %}">Gestor de Tareas</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Crear Nuevo Proyecto</h4>
                    </div>
                    <div class="card-body">
                        <!-- El method="POST" es crucial para enviar datos de forma segura -->
                        <form method="POST">
                            {% csrf_token %} <!-- Medida de seguridad obligatoria en Django -->
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre del Proyecto</label>
                                {{ form.nombre }}
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                {{ form.descripcion }}
                            </div>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'lista_proyectos' %}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Proyecto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
